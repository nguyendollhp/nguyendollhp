<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1200 400" width="1200" height="400">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
        @keyframes typing { from{width:0} to{width:100%} }
        @keyframes blink { 50%{border-color:transparent} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }
        @keyframes orbit { 0%{transform:rotate(0deg) translateX(60px) rotate(0deg)} 100%{transform:rotate(360deg) translateX(60px) rotate(-360deg)} }

        .container {
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          width:100%; height:400px; margin:0; overflow:hidden; position:relative;
          background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
          background-size: 400% 400%;
          animation: gradient 8s ease infinite;
        }

        .stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 2s infinite; }

        .greeting { color:#a78bfa; font-size:18px; font-weight:400; letter-spacing:4px; text-transform:uppercase;
                     margin-bottom:8px; animation:fadeIn 1s ease; }
        .name { color:#fff; font-size:48px; font-weight:700; margin-bottom:6px;
                 animation:fadeIn 1s ease .3s both; text-shadow: 0 0 40px rgba(167,139,250,.3); }
        .title-wrap { display:inline-block; overflow:hidden; animation:fadeIn 1s ease .6s both; }
        .title { color:#c4b5fd; font-size:20px; font-weight:300; white-space:nowrap;
                  overflow:hidden; border-right:2px solid #a78bfa;
                  animation: typing 3s steps(40) 1s both, blink .7s step-end infinite; }

        .icons { display:flex; gap:18px; margin-top:24px; animation:fadeIn 1s ease .9s both; }
        .icon-box { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
                     background:rgba(255,255,255,.08); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.1);
                     animation:float 3s ease-in-out infinite; color:#fff; font-size:13px; font-weight:700; }
        .icon-box:nth-child(2){animation-delay:.3s} .icon-box:nth-child(3){animation-delay:.6s}
        .icon-box:nth-child(4){animation-delay:.9s} .icon-box:nth-child(5){animation-delay:1.2s}
        .icon-box:nth-child(6){animation-delay:1.5s} .icon-box:nth-child(7){animation-delay:1.8s}

        .orb { position:absolute; border-radius:50%; filter:blur(60px); opacity:.15; animation:pulse 4s ease infinite; }
        .orb1 { width:300px; height:300px; background:#7c3aed; top:-50px; right:-50px; }
        .orb2 { width:200px; height:200px; background:#2563eb; bottom:-30px; left:-30px; animation-delay:2s; }
        .orb3 { width:150px; height:150px; background:#ec4899; bottom:50px; right:200px; animation-delay:1s; }
      </style>
      <div class="container">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="stars">
          <div class="star" style="width:2px;height:2px;top:10%;left:15%;animation-delay:0s"></div>
          <div class="star" style="width:3px;height:3px;top:20%;left:75%;animation-delay:.5s"></div>
          <div class="star" style="width:2px;height:2px;top:60%;left:25%;animation-delay:1s"></div>
          <div class="star" style="width:2px;height:2px;top:35%;left:90%;animation-delay:1.5s"></div>
          <div class="star" style="width:3px;height:3px;top:75%;left:60%;animation-delay:.3s"></div>
          <div class="star" style="width:2px;height:2px;top:45%;left:40%;animation-delay:.8s"></div>
          <div class="star" style="width:2px;height:2px;top:85%;left:85%;animation-delay:1.2s"></div>
          <div class="star" style="width:3px;height:3px;top:15%;left:50%;animation-delay:.6s"></div>
          <div class="star" style="width:2px;height:2px;top:50%;left:10%;animation-delay:1.8s"></div>
          <div class="star" style="width:2px;height:2px;top:70%;left:45%;animation-delay:.4s"></div>
          <div class="star" style="width:3px;height:3px;top:25%;left:30%;animation-delay:1.1s"></div>
          <div class="star" style="width:2px;height:2px;top:90%;left:70%;animation-delay:.7s"></div>
          <div class="star" style="width:2px;height:2px;top:5%;left:60%;animation-delay:1.4s"></div>
          <div class="star" style="width:3px;height:3px;top:55%;left:80%;animation-delay:.2s"></div>
          <div class="star" style="width:2px;height:2px;top:40%;left:5%;animation-delay:1.6s"></div>
        </div>
        <div class="greeting">Welcome to my universe</div>
        <div class="name">Nguyendollhp</div>
        <div class="title-wrap">
          <div class="title">Full-Stack Developer &#x2022; C# &#x2022; Python &#x2022; PHP &#x2022; JavaScript</div>
        </div>
        <div class="icons">
          <div class="icon-box" style="color:#9b4dca">C#</div>
          <div class="icon-box" style="color:#3776AB">Py</div>
          <div class="icon-box" style="color:#777BB4">PHP</div>
          <div class="icon-box" style="color:#F7DF1E">JS</div>
          <div class="icon-box" style="color:#61DAFB">Re</div>
          <div class="icon-box" style="color:#4FC08D">Vue</div>
          <div class="icon-box" style="color:#00599C">C++</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
