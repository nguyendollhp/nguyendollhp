<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1200 200" width="1200" height="200">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .box {
          font-family: 'Georgia', 'Times New Roman', serif;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          width:100%; height:200px; margin:0;
          background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
          background-size: 400% 400%; animation: gradient 8s ease infinite;
          border-radius: 12px;
        }
        .q { color:#a78bfa; font-size:48px; line-height:1; animation:fadeIn 1s ease; }
        .text { color:#e2e8f0; font-size:18px; font-style:italic; text-align:center;
                  max-width:700px; line-height:1.6; animation:fadeIn 1s ease .3s both; }
        .author { color:#7c3aed; font-size:14px; margin-top:8px; letter-spacing:2px;
                    text-transform:uppercase; animation:fadeIn 1s ease .6s both; }
      </style>
      <div class="box">
        <div class="q">&#x201C;</div>
        <div class="text">Code is like humor. When you have to explain it, it&#x2019;s bad.</div>
        <div class="author">&#x2014; Cory House</div>
      </div>
    </div>
  </foreignObject>
</svg>
